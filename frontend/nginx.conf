server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # PDF uploads are up to 5 MB; nginx's default limit is 1 MB.
    client_max_body_size 6m;

    # /api/... goes to the FastAPI container, with the /api prefix removed
    # (the same thing the Vite dev proxy does).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router pages like /applicant/applications/5 are not real files:
    # send index.html and let React show the right page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}