services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lendwise
      POSTGRES_PASSWORD: lendwise
      POSTGRES_DB: lendwise
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lendwise"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

volumes:
  pgdata: